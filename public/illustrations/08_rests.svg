<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550"><rect width="1000" height="550" fill="white"/><g font-family="Noto Sans CJK KR"><text x="40" y="55" font-size="30" fill="#19333E" text-anchor="start" font-weight="bold">소리가 없는 박도 계속 세어요</text><path d="M70 130 L460 130" fill="none" stroke="#167C93" stroke-width="5"/><path d="M448 122 L460 130 L448 138" fill="none" stroke="#167C93" stroke-width="4"/><text x="730" y="140" font-size="27" fill="#19333E" text-anchor="start" font-weight="normal">연주를 쉬어요</text><text x="500" y="185" font-size="25" fill="#19333E" text-anchor="middle" font-weight="normal">한 번 내쉬는 숨의 흐름</text><rect x="50" y="240" width="205" height="130" rx="15" fill="#EAF5F7"/><text x="152" y="295" font-size="36" fill="#19333E" text-anchor="middle" font-weight="bold">도</text><text x="152" y="340" font-size="23" fill="#19333E" text-anchor="middle" font-weight="normal">1박</text><rect x="275" y="240" width="205" height="130" rx="15" fill="#EAF5F7"/><text x="377" y="295" font-size="36" fill="#19333E" text-anchor="middle" font-weight="bold">도</text><text x="377" y="340" font-size="23" fill="#19333E" text-anchor="middle" font-weight="normal">2박</text><rect x="500" y="240" width="205" height="130" rx="15" fill="#EAF5F7"/><text x="602" y="295" font-size="36" fill="#19333E" text-anchor="middle" font-weight="bold">쉼</text><text x="602" y="340" font-size="23" fill="#19333E" text-anchor="middle" font-weight="normal">3박</text><rect x="725" y="240" width="205" height="130" rx="15" fill="#EAF5F7"/><text x="827" y="295" font-size="36" fill="#19333E" text-anchor="middle" font-weight="bold">쉼</text><text x="827" y="340" font-size="23" fill="#19333E" text-anchor="middle" font-weight="normal">4박</text><text x="60" y="440" font-size="34" fill="#19333E" text-anchor="start" font-weight="bold">소리  1 2     |     쉼  3 4</text><text x="60" y="500" font-size="28" fill="#19333E" text-anchor="start" font-weight="normal">쉼에서 필요하면 조용히 숨을 준비해요</text></g><