<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565"><rect width="1000" height="565" fill="white"/><g font-family="Noto Sans CJK KR"><rect x="25" y="15" width="950" height="55" rx="15" fill="#EAF5F7"/><text x="48" y="51" font-size="24" fill="#19333E" text-anchor="start" font-weight="normal">1  도는 2개 검은건반 묶음 바로 왼쪽</text><rect x="25" y="82" width="950" height="55" rx="15" fill="#EAF5F7"/><text x="48" y="118" font-size="24" fill="#19333E" text-anchor="start" font-weight="normal">2  중지는 손 3</text><rect x="25" y="149" width="950" height="55" rx="15" fill="#EAF5F7"/><text x="48" y="185" font-size="24" fill="#19333E" text-anchor="start" font-weight="normal">3  다장조 숫자보(1=C)의 6은 라</text><rect x="25" y="216" width="950" height="55" rx="15" fill="#EAF5F7"/><text x="48" y="252" font-size="24" fill="#19333E" text-anchor="start" font-weight="normal">4  아니요 모델에 따라 첫 건반이 달라요</text><rect x="25" y="283" width="950" height="55" rx="15" fill="#EAF5F7"/><text x="48" y="319" font-size="24" fill="#19333E" text-anchor="start" font-weight="normal">5  도 미 솔 높은 도</text><rect x="25" y="350" width="950" height="55" rx="15" fill="#EAF5F7"/><text x="48" y="386" font-size="24" fill="#19333E" text-anchor="start" font-weight="normal">6  이 그림의 높은 도는 손 5</text><rect x="25" y="417" width="950" height="55" rx="15" fill="#EAF5F7"/><text x="48" y="453" font-size="24" fill="#19333E" text-anchor="start" font-weight="normal">7  아니요 숨은 이어 가고 혀로 구분해요</text><rect x="25" y="484" width="950" height="55" rx="15" fill="#EAF5F7"/><text x="48" y="520" font-size="24" fill="#19333E" text-anchor="start" font-weight="normal">8  아니요 건반을 떼고 손을 옮겨요</text></g></svg>